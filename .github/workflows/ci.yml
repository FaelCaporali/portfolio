# Qualidade em todo push e pull request; deploy do Worker (site + API do contato) em fael.caporali.dev depois que a
# qualidade e o e2e passam na main. Actions fixadas por commit (a tag só no comentário): tag de terceiro pode mudar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, lint, knip, formatação, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Variáveis de dev do Worker: só chaves de TESTE públicas do Turnstile (o .dev.vars fica fora do git).
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm check
      # Prova que o build sai; a chave de teste só vale aqui (o deploy usa a do .env.production).
      - run: pnpm run build
        env:
          VITE_TURNSTILE_SITEKEY: 1x00000000000000000000AA

  e2e:
    name: e2e (Playwright contra o pnpm dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      # D1 local do dev (o formulário grava antes de enviar).
      - run: pnpm exec wrangler d1 migrations apply fael-caporali --local
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy em fael.caporali.dev
    needs: [quality, e2e]
    # Liga quando o Fael cria a variável DEPLOY_ENABLED=true e os segredos CLOUDFLARE_API_TOKEN e
    # CLOUDFLARE_ACCOUNT_ID no repositório (docs/DEPLOY.md). Até lá o job aparece como pulado, não como falha.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://fael.caporali.dev
    # Um deploy por vez e nunca cancelado no meio.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chave pública do Turnstile vem do .env.production; sem ela o vite.config.ts recusa o build.
      - run: pnpm run build
      # Idempotente: só aplica as migrações novas do D1 remoto.
      - run: pnpm exec wrangler d1 migrations apply fael-caporali --remote
      - run: pnpm exec wrangler deploy
